name: Build Website ZIP

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (예: v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Expected format: v1.2.3"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/website"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          cp -a website/. "$BUILD_DIR/"

          # ----------------------------------------
          # images 구성
          # ----------------------------------------

          rm -rf "$BUILD_DIR/images"
          mkdir -p "$BUILD_DIR/images"

          cp -a website/images/meta "$BUILD_DIR/images/"

          cp website/images/no-image.webp \
             "$BUILD_DIR/images/no-image.webp"

          cp website/images/no-image-snack.webp \
             "$BUILD_DIR/images/no-image-snack.webp"

          # ----------------------------------------
          # constants.js의 Apps Script URL 교체
          # ----------------------------------------

          export BUILD_DIR

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["BUILD_DIR"]) / "js/config/constants.js"

          text = path.read_text(encoding="utf-8")

          replacement = (
              "https://script.google.com/macros/s/"
              "your-google-apps-script-id/exec"
          )

          pattern = (
              r"https://script\.google\.com/macros/s/"
              r"[A-Za-z0-9_-]+/exec"
          )

          text, count = re.subn(pattern, replacement, text)

          if count == 0:
              raise SystemExit(
                  "Apps Script deployment URL was not found "
                  "in constants.js"
              )

          path.write_text(text, encoding="utf-8")

          print(f"Replaced {count} Apps Script deployment URL(s).")
          PY

      - name: Create website.zip
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/website"

          zip -r "$GITHUB_WORKSPACE/website.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            website.zip
            image-processor/docker-compose.yml
          generate_release_notes: true
          overwrite_files: true
