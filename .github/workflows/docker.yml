name: Build Image Processor

on:
  push:
    branches:
      - main
    paths:
      - 'image-processor/**'
      
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Disable Docker build cache'
        required: false
        default: false
        type: boolean

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./image-processor
          file: ./image-processor/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', github.repository) }}

          no-cache: ${{ inputs.no_cache || false }}

          cache-from: type=gha,scope=image-processor
          cache-to: type=gha,mode=max,scope=image-processor
