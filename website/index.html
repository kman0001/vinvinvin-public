<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wine Bar | Menu</title>

  <!-- Favicon -->
  <link rel="icon" href="images/meta/favicon.ico" type="image/x-icon">

  <!-- SEO and meta description -->
  <meta
    name="description"
    content="Discover a special wine that matches your taste. This is the digital menu of Your Wine Bar."
  >
  <meta
    name="keywords"
    content="Your Wine Bar, wine bar, wine menu, wine recommendations"
  >

  <!-- Open Graph (link previews for Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://your-domain.com">
  <meta property="og:title" content="🍷 Your Wine Bar">
  <meta
    property="og:description"
    content="Discover a special wine that matches your taste."
  >
  <meta property="og:image" content="images/meta/og-preview.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🍷 Your Wine Bar">
  <meta
    name="twitter:description"
    content="Discover a special wine that matches your taste."
  >
  <meta name="twitter:image" content="images/meta/og-preview.png">

  <!-- Pretendard -->
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  >

  <!-- Maru Buri -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/subsets/MaruBuri-dynamic-subset.css"
    type="text/css"
  >

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div
    id="loading-screen"
    role="status"
    aria-live="polite"
    aria-label="Preparing your menu."
  >

    <div class="loading-content">

      <img
        src="images/meta/favicon.ico"
        alt=""
        aria-hidden="true"
        class="loading-logo"
      >

      <div class="loading-title">
        Your Wine Bar
      </div>

      <p class="loading-message">
        Preparing your menu.
      </p>

      <div class="loading-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>

  <header>
    <h1>🍷 Your Wine Bar</h1>
  </header>

  <section id="notice"></section>

  <nav id="category-nav"></nav>

  <main id="menu"></main>

  <footer id="site-footer">
    <span class="footer-name">Your Wine Bar</span>
    <span>·</span>

    <a
      href="your-address-url"
      target="_blank"
      rel="noopener noreferrer"
    >
      Your Address
    </a>

    <span>·</span>

    <a
      href="your-instagram-url"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  </footer>

  <script type="module" src="js/app.js"></script>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-image" src="" alt="">
  </div>

</body>
</html>
