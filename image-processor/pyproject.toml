[project]
name = "image-processor"
version = "0.1.0"
description = "Wine menu image processor"
requires-python = ">=3.11"

dependencies = [
    "pillow>=10.0.0",
    "croniter>=2.0.0",
    "rembg[cpu]>=2.0.67",
    "boto3>=1.35.0"
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]